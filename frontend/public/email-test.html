<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Email - EmailJS</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/build/es5/index.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin-top: 15px;
      font-weight: bold;
      color: #555;
    }
    input, textarea {
      margin-top: 5px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: Arial, sans-serif;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #5568d3;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }
    #status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    #status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    #status.loading {
      background-color: #e2e3e5;
      color: #383d41;
      border: 1px solid #d6d8db;
      display: block;
    }
    .info {
      background-color: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 14px;
      color: #0066cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Teste de Email - EmailJS</h1>
    
    <div class="info">
      Este formulário usa EmailJS para enviar um email de boas-vindas. Preencha os campos e clique em "Enviar Email".
    </div>

    <form id="emailForm">
      <label for="userName">Nome do Usuário:</label>
      <input 
        type="text" 
        id="userName" 
        name="userName" 
        value="Paulo Lisboa" 
        required
      />

      <label for="userEmail">Email de Destino:</label>
      <input 
        type="email" 
        id="userEmail" 
        name="userEmail" 
        value="lisboabet7@gmail.com" 
        required
      />

      <label for="message">Mensagem (opcional):</label>
      <textarea 
        id="message" 
        name="message" 
        placeholder="Sua mensagem aqui (será usada como template)"
      >Bem-vindo à plataforma!</textarea>

      <button type="submit">Enviar Email</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    // Configuração do EmailJS
    const PUBLIC_KEY = 'qvlNxrJsFdvVJ_g9O';
    const SERVICE_ID = 'service_1rfe7qw';
    const TEMPLATE_ID = 'template_jnjnkys';

    // Inicializar EmailJS
    (function() {
      try {
        emailjs.init(PUBLIC_KEY);
        console.log('✅ EmailJS inicializado com sucesso');
      } catch (e) {
        console.error('❌ Erro ao inicializar EmailJS:', e);
      }
    })();

    // Handler do formulário
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusEl = document.getElementById('status');
      const userName = document.getElementById('userName').value;
      const userEmail = document.getElementById('userEmail').value;
      const message = document.getElementById('message').value;

      // Mostrar carregamento
      statusEl.className = 'loading';
      statusEl.textContent = 'Enviando email...';

      try {
        const result = await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
          user_name: userName,
          user_email: userEmail,
          subject: '🎉 Bem-vindo à Plataforma de Solicitações!',
          message: message,
          to_email: userEmail
        });

        console.log('✅ Email enviado com sucesso!', result);
        statusEl.className = 'success';
        statusEl.innerHTML = `
          <strong>✅ Email enviado com sucesso!</strong><br>
          ID da resposta: ${result.status}<br>
          Verifique a caixa de entrada de <strong>${userEmail}</strong>
        `;
      } catch (error) {
        console.error('❌ Erro ao enviar email:', error);
        statusEl.className = 'error';
        statusEl.innerHTML = `
          <strong>❌ Erro ao enviar email</strong><br>
          ${error.text || error.message || 'Erro desconhecido'}
        `;
      }
    });
  </script>
</body>
</html>
